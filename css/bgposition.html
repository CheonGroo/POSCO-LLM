<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .base {
        height: 1000px;
        background-color: ivory;
        background-image: url("../html/yushi.jpg");
      }
      .no {
        background-repeat: no-repeat;
      }
      .center {
        background-position: center;
      }
      .br {
        background-position: bottom right;
      }
      .px {
        background-position: 100px 30px;
      }
    </style>
  </head>
  <body>
    <section>
      <div class="base no center"></div>
      <div class="base no br"></div>
      <div class="base no px"></div>
    </section>
  </body>
</html>
