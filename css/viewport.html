<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .min {
        background-color: lightskyblue);
        color: white;
        padding: 15px;
        text-align: center;
      }
      @media screen and (min-width: 480px) {
        .min {
          background-color: lightgreen;
        }
      }
      .max {
        background-color: rgba(255, 154, 46, 0.417);
        color: black;
        padding: 15px;
        text-align: center;
      }
      @media screen and (min-width: 480px) {
        .max {
          background-color: lightyellow;
        }
      }
      .test{
        background-color: lightgreen;
        color: green;
        padding: 15px;
        text-align: center;
      }
      @media screen and (min-width: 768px) and (max-width: 1024px)  {
        .test {
          background-color: lightyellow;
          color: sandybrown;
        }
      }
      @media screen and (min-width: 1024px) {
        .test {
          background-color: lightskyblue;
          color: darkblue;
        }
      }
    </style>
  </head>
  <body>
    <section>
      <h2>@media min-width</h2>
      <div class="min">창 너미 480px 이상이면 연두색, 미만이면 하늘색</div>
      <div class="max">창 너미 480px 이상이면 노란색, 미만이면 주황색</div>
      <div class="test">연두색 ~ 768 ~ 노란색 ~ 하늘색</div>
    </section>
  </body>
</html>
