<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 150px;
        height: 150px;
        background-color: lightgreen;
        border: 2px solid green;
        border-radius: 100%;
        text-align: center;
        line-height: 150px;
      }
      .head {
        position: relative;
        top: 200px;
        left: 200px;
      }
      .eye-1 {
        position: absolute;
        top: 250px;
        left: 245px;
        background-color: white;
        width: 30px;
        height: 30px;
        z-index: 2;
      }
      .eye-2 {
        position: absolute;
        top: 260px;
        left: 245px;
        background-color: black;
        width: 15px;
        height: 15px;
        z-index: 3;
      }
      .a {
        position: absolute;
        top: 287px;
        left: 580px;
        background-color: rgb(147, 214, 166);
      }
      .b {
        position: absolute;
        top: 250px;
        left: 500px;
        background-color: darkgreen;
        z-index: 2;
      }
      .c {
        position: absolute;
        top: 270px;
        left: 400px;
        background-color: greenyellow;
      }
      .d {
        position: absolute;
        top: 285px;
        left: 300px;
        background-color: olive;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <section>
      <div class="head"></div>
      <div class="eye-1"></div>
      <div class="eye-2"></div>
      <div class="body a"></div>
      <div class="body b"></div>
      <div class="body c"></div>
      <div class="body d"></div>
    </section>
  </body>
</html>
