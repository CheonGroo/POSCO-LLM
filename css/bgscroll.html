<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .frame {
        height: 500px;
        overflow: auto;
        border: 1px solid black;
        margin-bottom: 10px;
        background-color: aliceblue;
        background-image: url("../html/yushi.jpg");
        background-repeat: no-repeat;
        background-position: center 10px;
      }
      .local {
        background-attachment: local;
      }
      .base {
        height: 500px;
        border: 1px solid black;
        background-color: blanchedalmond;
        background-image: url("../html/sakuya.jpg");
        background-repeat: no-repeat;
        background-position: center 10px;
      }
      .cover {
        /* 넘치는 부분 짤림 */
        background-size: cover;
      }
      .contain {
        /* 넘치지 않게 비율 유지해서 채움 */
        background-size: contain;
      }
      .px {
        /* 가로 세로를 강제로 지정 (비율 유지 x) */
        background-size: 200px 160px;
      }
    </style>
  </head>
  <body>
    <section>
      <div class="frame">
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
      </div>
      <div class="frame local">
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
        <p>a</p>
      </div>
    </section>
    <section>
      <p>base</p>
      <div class="base"></div>
      <p>빈틈 없이 덮음</p>
      <div class="base cover"></div>
      <p>전부 보이게</p>
      <div class="base contain"></div>
      <p>200px 40px</p>
      <div class="base px"></div>
    </section>
  </body>
</html>
