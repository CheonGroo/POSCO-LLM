<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .wrap .item {
        display: inline-block;
        /* width: 200px;
        height: 100px;
        margin-right: 30px;

      }
      div {
        background-color: orange;

        height: 200px;

      span {
        text-align: left;
        margin-right: 30px;
        padding-right: 200px;
        padding-bottom: 100px;
      }

      [value="html"] {
        background-color: skyblue;
      }
      [value="css"] {

      }
      [value="java"] {

      }
    </style>
  </head>
  <body>
    <section>
      <div class="wrap">
        <span class="item" value="html">HTML</span>
        <span class="item" value="css">CSS</span>
        <span class="item" value="java">JavaScript</span>
      </div>
    </section>
  </body>
