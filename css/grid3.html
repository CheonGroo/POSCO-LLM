<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .item {
        width: 50px;
        height: 50px;
        background-color: lightcyan;
        border: 2px solid black;
        text-align: center;
        line-height: 60px;
      }
      .s13-container {
        display: grid;
        background-color: lightgray;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 60px 60px;
        gap: 6px;
      }
      .s13-wide {
        /* 열 라인 1~3 사이 2칸 차지 */
        grid-column: 1/3;
        background-color: lightsalmon;
      }
      .s13-tall {
        /* 시작점부터 span 2칸 */
        grid-row: 1 / span 2;
        background-color: lightgoldenrodyellow;
      }
      .s14-self {
        /* 숫자가 높을수록 레이어가 위에 있음 */
        z-index: 1;
        align-self: end;
      }
      .s14-first {
        order: -1;
      }
      .s14-top {
        /* 겹치게 만들기 */
        z-index: 0;
        margin-left: -30px;
        background-color: blue;
      }
    </style>
  </head>

  <body>
    <section>
      <h2>섹션 13 grid-column / grid-row - 라인 번호로 배치</h2>
      <div class="s13-container">
        <div class="item s13-wide">1/3</div>
        <div class="item s13-tall">span 2</div>
        <div class="item s14-self">1</div>
        <div class="item s14-first">2</div>
        <div class="item s14-top">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
      </div>
    </section>
  </body>
</html>
