<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 150px;
        height: 150px;
        text-align: center;
        line-height: 150px;
      }
      .s9-hex {
        background-color: #ffd8a8;
      }
      .s9-rgba {
        background-color: rgba(123, 123, 123, 50%);
      }
      .s9-gra {
        background: linear-gradient(45deg, ivory, 60%, lightpink);
      }
      .img {
        background-image: url("../html/yushi.jpg");
        margin: 10px;
      }
      .img-no {
        background-repeat: no-repeat;
      }
      .img-x {
        background-repeat: repeat-x;
      }
    </style>
  </head>
  <body>
    <h2>color</h2>
    <div class="box s9-hex">hex</div>
    <div class="box s9-rgba">반투명</div>
    <div class="box s9-gra">그라데이션</div>

    <h2>img</h2>
    <!-- <img class="img" src="../html/yushi.jpg" /> -->
    <div class="img"></div>
    <div class="img-no"></div>
    <div class="img-x"></div>
  </body>
</html>
